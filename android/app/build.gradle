plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

android {
    namespace = "de.paulporg.obmc"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled = true
    }

    // Unterdrückt Javac-Warnung "Quell-/Zielwert 8 ist veraltet"
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << '-Xlint:-options'
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "de.paulporg.obmc"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }

    // Zusätzliche Kopie der Release-APK als fester Name pp_qgap.apk
    // (app-release.apk bleibt erhalten, da das Flutter-Tool diesen Namen erwartet).
    applicationVariants.all { variant ->
        if (variant.buildType.name == "release") {
            variant.assembleProvider.get().doLast {
                variant.outputs.each { output ->
                    copy {
                        from output.outputFile
                        into new File(output.outputFile.parentFile.parentFile.parentFile, "flutter-apk")
                        rename { "pp_qgap.apk" }
                    }
                }
            }
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Core library desugaring (required by flutter_local_notifications)
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
    // SAF-Zugriff auf USB-OTG-Volumes (DocumentFile-API)
    implementation "androidx.documentfile:documentfile:1.0.1"
}
